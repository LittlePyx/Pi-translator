<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pi Translator - PDF 翻译</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header class="app-header">
        <div class="brand">
          <img src="/brand/pi_logo.png" alt="" />
          <div>
            <strong>Pi Translator</strong>
            <span>PDF 划词翻译</span>
          </div>
        </div>
        <button id="open-settings" class="text-action" type="button">设置</button>
      </header>

      <section id="empty-state" class="empty-state" data-context="loading" aria-busy="true" aria-labelledby="empty-title">
        <div class="empty-mark">π</div>
        <h1 id="empty-title">正在检查当前页面…</h1>
        <p id="empty-description">确认当前标签页是否可以开始 PDF 翻译。</p>
        <button id="empty-action" class="empty-action" type="button" hidden>打开 Pi PDF 阅读器</button>
        <p id="empty-status" class="empty-status" role="status" aria-live="polite" aria-atomic="true"></p>
      </section>

      <section id="session" hidden>
        <section class="session-context" aria-label="当前 PDF">
          <div class="document-line">
            <span>当前 PDF</span>
            <strong id="source-label"></strong>
          </div>
          <button id="open-pi-reader" type="button">用 Pi 打开</button>
        </section>
        <p id="reader-hint-text" class="session-context-note" hidden></p>

        <aside id="pdf-access-alert" class="access-alert" role="alert" hidden>
          <strong id="pdf-access-title">需要 PDF 读取权限</strong>
          <p id="pdf-access-message"></p>
          <ol id="pdf-access-steps"></ol>
          <div class="access-actions">
            <button id="open-extension-management" type="button">打开 Edge 扩展管理页</button>
            <button id="retry-pdf-access" type="button">重新检测</button>
          </div>
        </aside>

        <section class="content-section source-section">
          <div class="section-heading">
            <h2>原文</h2>
            <button id="source-toggle" class="source-toggle" type="button" aria-controls="source-text" aria-expanded="false" hidden>展开</button>
          </div>
          <p id="source-text"></p>
        </section>

        <section class="content-section result-section">
          <div class="section-heading">
            <h2 id="translation-heading">译文</h2>
            <div class="translation-heading-tools">
              <button id="formula-view" type="button" hidden>源码</button>
              <span id="translation-state" tabindex="-1" aria-live="polite"></span>
              <button id="stop-translation" type="button" title="停止翻译" hidden>停止</button>
            </div>
          </div>
          <div id="progress-track" class="progress-track" hidden><i></i></div>
          <div id="lexical-lookup" class="lexical-lookup" hidden>
            <div class="lexical-meta">
              <span id="lexical-pronunciation"></span>
              <span id="lexical-part-of-speech"></span>
              <button id="speak-source" type="button" aria-pressed="false">朗读原文</button>
            </div>
            <div id="lexical-senses" class="lexical-senses"></div>
          </div>
          <div id="translation-text" class="translation-text"></div>
          <div id="error-message" class="error-message" role="alert" aria-live="assertive" hidden></div>
          <div id="error-actions" class="error-actions" hidden>
            <button id="retry" type="button">重试</button>
            <button id="error-settings" class="secondary" type="button">检查设置</button>
          </div>
        </section>

        <footer id="session-actions" class="session-actions" hidden>
          <button id="copy" class="copy-action" type="button" disabled>复制译文</button>
          <span id="copy-feedback" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></span>
          <button id="correct" class="correction-action" type="button" hidden>修正</button>
          <span id="correction-undo" class="correction-undo" role="status" hidden>
            <span id="correction-undo-message">已修正 ·</span>
            <button id="undo-correction" type="button">撤销</button>
          </span>
          <span id="status" role="status" aria-live="polite"></span>
        </footer>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
