<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pi Translator</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <span class="logo"><img src="/brand/pi_logo.png" alt="" /></span>
        <span>
          <strong>Pi Translator</strong>
          <small>Quick controls</small>
        </span>
      </header>

      <label>
        <span>目标语言</span>
        <select id="target-language">
          <option value="zh-CN">简体中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
        </select>
      </label>

      <label id="api-profile-field" hidden>
        <span>翻译接口</span>
        <select id="api-profile"></select>
      </label>

      <section class="site-control">
        <div>
          <span>当前网站</span>
          <strong id="site-name">正在读取…</strong>
        </div>
        <label class="switch-row">
          <input id="pause-site" type="checkbox" />
          <span>暂停自动划词</span>
        </label>
        <p>暂停后不再自动显示浮动按钮，右键菜单和快捷键仍可使用。</p>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <button id="open-sidebar" class="primary-action" type="button">打开连续翻译侧栏</button>
      <button id="open-settings" type="button">打开完整设置</button>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
