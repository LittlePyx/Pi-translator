<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pi PDF - Pi Translator</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header id="pdf-toolbar" class="toolbar">
      <div class="brand" aria-label="Pi Translator PDF 阅读器">
        <img src="/brand/pi_logo.png" alt="" />
        <span><strong>Pi PDF</strong><small id="document-name">未打开文档</small></span>
      </div>
      <div class="document-actions">
        <input id="file-input" type="file" accept="application/pdf,.pdf" hidden />
        <button id="choose-file" class="primary" type="button">打开 PDF</button>
        <label id="page-jump" class="page-jump" title="跳转到页码" hidden>
          <input id="page-number" type="number" min="1" value="1" inputmode="numeric" aria-label="当前页码" />
          <span aria-hidden="true">/</span>
          <output id="page-count" aria-label="总页数">0</output>
        </label>
        <button
          id="open-outline"
          class="outline-open"
          type="button"
          title="打开文档导航"
          aria-label="打开文档导航"
          aria-controls="pdf-outline"
          aria-expanded="false"
          disabled
          hidden
        >导航</button>
        <button id="open-search" class="search-open" type="button" title="搜索 PDF（Ctrl+F）" aria-label="搜索 PDF" disabled>搜索</button>
        <button
          id="translate-document"
          class="document-translate"
          type="button"
          title="翻译整篇 PDF"
          aria-label="翻译整篇 PDF"
          aria-controls="pdf-document-translation"
          aria-expanded="false"
          disabled
        >译全文</button>
      </div>
      <div class="region-tools">
        <button
          id="recognize-page"
          class="region-action"
          type="button"
          title="用 Qwen OCR 识别当前页并生成临时文字层"
          disabled
          hidden
        >识别本页</button>
        <button
          id="region-translate"
          class="region-action"
          type="button"
          aria-pressed="false"
          title="框选图片或扫描文字进行翻译"
          disabled
        >框选翻译</button>
        <button
          id="region-queue"
          class="queue-action"
          type="button"
          aria-controls="region-queue-panel"
          aria-expanded="false"
          title="查看框选翻译队列"
          hidden
        >
          队列 <span id="region-queue-count">0</span>
        </button>
        <section id="region-queue-panel" class="queue-panel" aria-label="框选翻译队列" hidden>
          <header><strong>翻译队列</strong><small>最多 3 项</small></header>
          <div id="region-queue-list" class="queue-list"></div>
        </section>
      </div>
      <div class="zoom-controls" aria-label="缩放控制">
        <button id="zoom-out" type="button" title="缩小" disabled>−</button>
        <output id="zoom-value">125%</output>
        <button id="zoom-in" type="button" title="放大" disabled>＋</button>
        <button id="fit-width" type="button" title="适合宽度" aria-label="适合宽度" disabled>↔</button>
      </div>
      <button id="open-settings" class="quiet" type="button">设置</button>
    </header>

    <aside
      id="pdf-document-translation"
      class="pdf-document-translation"
      aria-label="PDF 全文翻译"
      hidden
    >
      <header>
        <div class="pdf-document-translation-title">
          <span class="pdf-document-translation-mark" aria-hidden="true">
            <img src="/brand/pi_logo.png" alt="" />
          </span>
          <span>
            <strong>PDF 全文翻译</strong>
            <small id="pdf-document-translation-status" aria-live="polite">准备文档内容…</small>
          </span>
        </div>
        <button
          id="pdf-document-translation-close"
          type="button"
          title="关闭全文翻译面板"
          aria-label="关闭全文翻译面板"
        >×</button>
      </header>
      <section class="pdf-document-translation-overview" aria-label="PDF 全文翻译进度与操作">
        <div
          id="pdf-document-translation-progress"
          class="pdf-document-translation-progress"
          role="progressbar"
          aria-label="PDF 全文翻译进度"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          hidden
        ><i></i></div>
        <div class="pdf-document-translation-actions">
          <button id="pdf-document-translation-primary" class="primary" type="button">开始翻译</button>
          <button id="pdf-document-translation-stop" type="button" hidden>停止</button>
          <details id="pdf-document-translation-copy-menu" class="pdf-document-translation-copy-menu" hidden>
            <summary>复制</summary>
            <div>
              <button id="pdf-document-translation-copy-translation" type="button">纯译文</button>
              <button id="pdf-document-translation-copy-bilingual" type="button">双语 Markdown</button>
            </div>
          </details>
          <button id="pdf-document-translation-clear" type="button" hidden>重新翻译</button>
        </div>
        <small id="pdf-document-translation-copy-feedback" class="pdf-document-translation-copy-feedback" aria-live="polite"></small>
        <label id="pdf-document-translation-retention" class="pdf-document-translation-retention" hidden>
          <span>
            <strong>关闭后保留译文</strong>
            <small id="pdf-document-translation-retention-status" aria-live="polite">默认只保留在当前 Edge 会话</small>
          </span>
          <input
            id="pdf-document-translation-retention-toggle"
            type="checkbox"
            role="switch"
            aria-label="关闭 Edge 后仍在本机保留这份 PDF 的全文译文"
          />
        </label>
      </section>
      <section class="pdf-document-translation-scope" aria-label="PDF 翻译范围">
        <div class="pdf-document-translation-scope-heading">
          <strong>翻译范围</strong>
          <span>只会发送所选正文</span>
        </div>
        <label class="pdf-document-translation-range-label">
          <span>范围</span>
          <select id="pdf-document-translation-range" aria-label="翻译页码范围" disabled>
            <option value="all">整篇文档</option>
            <option id="pdf-document-translation-range-current" value="current">当前页</option>
            <option value="custom">指定页码</option>
          </select>
        </label>
        <form id="pdf-document-translation-custom-range" hidden>
          <input
            id="pdf-document-translation-custom-pages"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            aria-label="指定翻译页码"
            placeholder="如 1-6, 9, 12-15"
          />
          <button type="submit">应用</button>
        </form>
        <div class="pdf-document-translation-section-options">
          <label title="从识别到的 References 或参考文献标题开始跳过，遇到附录标题后停止">
            <input id="pdf-document-translation-skip-references" type="checkbox" disabled />
            <span>跳过参考文献</span>
          </label>
          <label title="从识别到的 Appendix、Supplementary Materials 或附录标题开始跳过">
            <input id="pdf-document-translation-skip-appendix" type="checkbox" disabled />
            <span>跳过附录</span>
          </label>
        </div>
        <small id="pdf-document-translation-range-feedback" aria-live="polite"></small>
      </section>
      <section
        id="pdf-document-translation-ocr"
        class="pdf-document-translation-ocr"
        aria-label="扫描页文字识别"
        hidden
      >
        <span class="pdf-document-translation-ocr-badge" aria-hidden="true">OCR</span>
        <span class="pdf-document-translation-ocr-copy">
          <strong>扫描页尚未识别</strong>
          <small id="pdf-document-translation-ocr-status" aria-live="polite"></small>
        </span>
        <button id="pdf-document-translation-ocr-action" type="button"></button>
      </section>
      <p id="pdf-document-translation-note" class="pdf-document-translation-note">
        先在本地读取文字层；确认开始后才会批量发送正文。扫描页会保留原页并标记为未识别。
      </p>
      <div
        id="pdf-document-translation-pages"
        class="pdf-document-translation-pages"
        aria-label="按页排列的 PDF 译文"
      ></div>
    </aside>

    <aside id="pdf-outline" class="pdf-outline" aria-label="当前 PDF 文档导航" hidden>
      <header>
        <span><strong>文档导航</strong><small id="pdf-outline-status"></small></span>
        <button id="pdf-outline-close" type="button" title="关闭导航（Esc）" aria-label="关闭文档导航">×</button>
      </header>
      <div class="pdf-navigation-tabs" role="tablist" aria-label="文档导航内容">
        <button
          id="pdf-navigation-outline-tab"
          type="button"
          role="tab"
          aria-controls="pdf-outline-tree"
          aria-selected="true"
        >目录</button>
        <button
          id="pdf-navigation-bookmarks-tab"
          type="button"
          role="tab"
          aria-controls="pdf-bookmarks"
          aria-selected="false"
        >书签</button>
      </div>
      <nav id="pdf-outline-tree" class="pdf-outline-tree" role="tree" aria-label="章节目录"></nav>
      <section id="pdf-bookmarks" class="pdf-bookmarks" role="tabpanel" aria-label="阅读书签" hidden>
        <div class="pdf-bookmark-toolbar">
          <button id="pdf-bookmark-add" type="button">＋ 添加当前页</button>
          <small id="pdf-bookmark-status">0 / 50</small>
        </div>
        <div id="pdf-bookmark-list" class="pdf-bookmark-list" role="list"></div>
        <p id="pdf-bookmark-empty" class="pdf-bookmark-empty">还没有书签。读到重要位置时，添加当前页即可。</p>
      </section>
    </aside>

    <section id="pdf-search" class="pdf-search" role="search" aria-label="搜索当前 PDF" hidden>
      <span class="pdf-search-icon" aria-hidden="true"></span>
      <input
        id="pdf-search-query"
        type="search"
        maxlength="160"
        autocomplete="off"
        spellcheck="false"
        aria-label="搜索当前 PDF"
        placeholder="搜索当前 PDF"
      />
      <output id="pdf-search-status" class="pdf-search-status" aria-live="polite">输入关键词</output>
      <button id="pdf-search-previous" type="button" title="上一个结果（Shift+Enter）" aria-label="上一个搜索结果" disabled>↑</button>
      <button id="pdf-search-next" type="button" title="下一个结果（Enter）" aria-label="下一个搜索结果" disabled>↓</button>
      <button
        id="pdf-search-results-toggle"
        class="pdf-search-results-toggle"
        type="button"
        title="收起搜索结果"
        aria-label="收起搜索结果"
        aria-controls="pdf-search-results"
        aria-expanded="true"
        hidden
      >☷</button>
      <button id="pdf-search-close" class="pdf-search-close" type="button" title="关闭搜索（Esc）" aria-label="关闭搜索">×</button>
      <div id="pdf-search-results" class="pdf-search-results" aria-label="PDF 搜索结果" hidden></div>
    </section>

    <main id="document-stage" class="document-stage" tabindex="-1">
      <section id="empty-state" class="empty-state">
        <img src="/brand/pi_logo.png" alt="" />
        <h1>打开一份 PDF 开始阅读</h1>
        <p>选择文字或拖选段落后，使用旁边的小 Pi 按钮翻译。</p>
        <button id="empty-open" class="primary" type="button">选择本地 PDF</button>
        <small>也可将 PDF 拖到此处；文件仅在当前标签页中读取，不会上传给扩展服务器。</small>
      </section>
      <div id="loading" class="loading" hidden role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <strong id="loading-text">正在打开 PDF…</strong>
      </div>
      <section id="notice" class="notice" hidden role="status" aria-live="polite" aria-atomic="true"></section>
      <button id="pdf-link-return" class="pdf-link-return" type="button" hidden>← 返回</button>
      <div id="pdf-viewer" class="pdf-viewer" hidden></div>
    </main>
    <section id="pdf-drop-overlay" class="pdf-drop-overlay" role="status" aria-live="polite" hidden>
      <div class="pdf-drop-card">
        <span class="pdf-drop-badge" aria-hidden="true">PDF</span>
        <span>
          <strong id="pdf-drop-title">松开以打开 PDF</strong>
          <small id="pdf-drop-description">文件只在当前标签页中读取</small>
        </span>
      </div>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
