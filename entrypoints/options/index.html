<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeX Selection Translator 设置</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">Microsoft Edge 扩展</p>
        <h1>TeX Selection Translator</h1>
        <p class="intro">在 Overleaf 中翻译选中的学术文本，并保护常见 LaTeX 结构。</p>
      </header>

      <section class="card notice">
        <h2>数据说明</h2>
        <p>只有你主动选择并触发翻译的文本会发送到 DeepSeek API。本扩展默认不保存翻译历史。</p>
      </section>

      <form id="settings-form" class="card">
        <h2>DeepSeek</h2>
        <label>
          <span>API Key</span>
          <input id="api-key" type="password" autocomplete="off" placeholder="输入新的 API Key" />
          <small id="api-key-state">尚未配置</small>
        </label>

        <label class="check-row">
          <input id="persist-key" type="checkbox" />
          <span>在本机持久保存 API Key</span>
        </label>
        <p class="hint">默认仅保存到当前浏览器会话。持久保存更方便，但不代表操作系统级加密。</p>

        <label>
          <span>模型</span>
          <input id="model" type="text" spellcheck="false" />
        </label>

        <div class="grid">
          <label>
            <span>目标语言</span>
            <select id="target-language">
              <option value="zh-CN">简体中文</option>
              <option value="en">English</option>
              <option value="ja">日本語</option>
              <option value="de">Deutsch</option>
              <option value="fr">Français</option>
            </select>
          </label>
          <label>
            <span>翻译风格</span>
            <select id="style">
              <option value="academic">学术</option>
              <option value="general">通用</option>
              <option value="literal">直译</option>
            </select>
          </label>
        </div>

        <h2>Overleaf</h2>
        <label class="check-row">
          <input id="floating-button" type="checkbox" />
          <span>选中文字后显示浮动翻译按钮</span>
        </label>
        <label class="check-row">
          <input id="context-menu" type="checkbox" />
          <span>显示右键翻译菜单</span>
        </label>

        <div class="actions">
          <button class="primary" type="submit">保存设置</button>
          <button id="test-connection" type="button">测试连接</button>
          <button id="clear-key" class="danger" type="button">清除 API Key</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>

      <section class="card compact">
        <h2>快捷键</h2>
        <p>默认快捷键为 <kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>T</kbd>，可在 Edge 扩展快捷键页面修改。</p>
        <button id="open-shortcuts" type="button">打开快捷键设置</button>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
