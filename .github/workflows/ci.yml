name: Edge extension CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: edge-extension-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan for committed secrets
        run: npm run check:secrets

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build extension
        run: npm run build:edge

      - name: Run Edge end-to-end tests
        run: npm run test:e2e:built

      - name: Upload Edge end-to-end diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pi-translator-edge-e2e-diagnostics-${{ github.sha }}
          path: test-results/**
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true

      - name: Create Edge installation package
        run: npm run zip:edge

      - name: Verify release package consistency
        run: npm run check:release-artifact

      - name: Upload verified package
        uses: actions/upload-artifact@v6
        with:
          name: pi-translator-edge-${{ github.sha }}
          path: .output/*-edge.zip
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
