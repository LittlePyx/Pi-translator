name: Edge extension CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan for committed secrets
        run: npm run check:secrets

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build extension
        run: npm run build:edge

      - name: Run Edge end-to-end tests
        run: npx playwright test tests/e2e/selection-overlay.spec.ts

      - name: Create Edge installation package
        run: npm run zip:edge

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: pi-translator-edge-${{ github.sha }}
          path: .output/*-edge.zip
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
